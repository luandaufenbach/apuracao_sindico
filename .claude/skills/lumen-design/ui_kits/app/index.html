<script type="text/babel">
const { ToastRegion, Toast } = window.LumenDesignSystem_12638a;
function App() {
  const [view, setViewRaw] = React.useState(() => localStorage.getItem('lumen-app-view') || 'overview');
  const [theme, setTheme] = React.useState(() => localStorage.getItem('lumen-app-theme') || 'dark');
  const [toasts, setToasts] = React.useState([]);
  React.useEffect(() => { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('lumen-app-theme', theme); }, [theme]);
  const setView = v => { setViewRaw(v); localStorage.setItem('lumen-app-view', v); window.scrollTo(0, 0); };
  const toast = t => { const id = Date.now() + Math.random(); setToasts(ts => [...ts, { ...t, id }]); setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), 4500); };
  const Screen = { overview: OverviewScreen, activity: ActivityScreen, assets: AssetsScreen, settings: SettingsScreen }[view] || OverviewScreen;
  return (
    <>
      <AppShell view={view} setView={setView}><Screen go={setView} toast={toast} theme={theme} setTheme={setTheme} /></AppShell>
      <ToastRegion offsetBottom={64}>{toasts.map(t => <Toast key={t.id} {...t} onClose={() => setToasts(ts => ts.filter(x => x.id !== t.id))} />)}</ToastRegion>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
