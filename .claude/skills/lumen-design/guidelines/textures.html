<!-- @dsCard group="Effects" viewport="700x210" subtitle="Grain (soft-light 18%), dot field, data grid" name="Textures" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.c{display:flex;flex-direction:column;gap:8px}.b{height:130px;border-radius:2px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--border-subtle)}</style></head><body><div class="r"><div class="c"><div class="b" style="background:var(--texture-grain),var(--blue-700);background-blend-mode:soft-light,normal"></div><span class="mono"><b>--texture-grain</b></span></div>
<div class="c"><div class="b" style="background:var(--texture-dots),#000;background-size:var(--texture-dots-size),auto"></div><span class="mono"><b>--texture-dots</b> 16px</span></div>
<div class="c"><div class="b" style="background:var(--texture-grid),#000;background-size:var(--texture-grid-size),auto"></div><span class="mono"><b>--texture-grid</b> 40px</span></div></div></body></html>
