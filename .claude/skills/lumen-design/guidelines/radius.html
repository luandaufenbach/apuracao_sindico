<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.r{display:flex;gap:20px}.c{display:flex;flex-direction:column;gap:8px}.b{width:88px;height:72px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong)}</style></head><body><div class="r"><div class="c"><div class="b" style="border-radius:0"></div><span class="mono"><b>0</b><br>0</span></div><div class="c"><div class="b" style="border-radius:2px"></div><span class="mono"><b>xs · control</b><br>2px</span></div><div class="c"><div class="b" style="border-radius:4px"></div><span class="mono"><b>sm · card</b><br>4px</span></div><div class="c"><div class="b" style="border-radius:6px"></div><span class="mono"><b>md</b><br>6px</span></div><div class="c"><div class="b" style="border-radius:10px"></div><span class="mono"><b>lg · sheet</b><br>10px</span></div><div class="c"><div class="b" style="border-radius:9999px"></div><span class="mono"><b>full</b><br>9999px</span></div></div></body></html>
