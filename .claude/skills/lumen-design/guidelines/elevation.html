<!-- @dsCard group="Effects" viewport="700x190" subtitle="Dark: surface steps + hairlines. Light: soft shadows." name="Elevation" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:0}.side{padding:20px;display:flex;gap:14px}.c{display:flex;flex-direction:column;gap:8px}.b{width:80px;height:64px;border-radius:4px}</style></head><body><div class="wrap"><div class="side" style="background:#000"><div class="c"><div class="b" style="background:#000;box-shadow:none"></div><span class="mono"><b>canvas</b></span></div><div class="c"><div class="b" style="background:var(--surface-1);box-shadow:var(--shadow-hairline)"></div><span class="mono"><b>surface-1</b></span></div><div class="c"><div class="b" style="background:var(--surface-2);box-shadow:var(--shadow-raised)"></div><span class="mono"><b>surface-2</b></span></div><div class="c"><div class="b" style="background:var(--surface-2);box-shadow:var(--shadow-overlay)"></div><span class="mono"><b>overlay</b></span></div></div>
<div class="side" data-theme="light" style="background:var(--gray-50)"><div class="c"><div class="b" style="background:#fff;box-shadow:var(--shadow-light-1)"></div><span class="mono"><b>light-1</b></span></div><div class="c"><div class="b" style="background:#fff;box-shadow:var(--shadow-light-2)"></div><span class="mono"><b>light-2</b></span></div></div></div></body></html>
