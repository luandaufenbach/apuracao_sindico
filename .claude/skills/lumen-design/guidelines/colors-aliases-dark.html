<!-- @dsCard group="Colors" viewport="700x240" subtitle="Semantic surfaces, text & borders — dark (default)" name="Aliases · Dark" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.c{display:flex;flex-direction:column;gap:6px}.sw{height:56px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--border-default)}.txt{display:flex;gap:24px;margin-top:20px;font-size:15px}.brd{display:flex;gap:8px;margin-top:16px}.brd span{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);padding:8px 12px;border-radius:2px}.mono{font-size:10px}</style></head><body><div class="grid"><div class="c"><div class="sw" style="background:var(--bg-canvas)"></div><div class="mono"><b>--bg-canvas</b></div></div><div class="c"><div class="sw" style="background:var(--surface-1)"></div><div class="mono"><b>--surface-1</b></div></div><div class="c"><div class="sw" style="background:var(--surface-2)"></div><div class="mono"><b>--surface-2</b></div></div><div class="c"><div class="sw" style="background:var(--surface-3)"></div><div class="mono"><b>--surface-3</b></div></div><div class="c"><div class="sw" style="background:var(--surface-inverse)"></div><div class="mono"><b>--surface-inverse</b></div></div><div class="c"><div class="sw" style="background:var(--surface-accent)"></div><div class="mono"><b>--surface-accent</b></div></div></div>
<div class="txt"><span style="color:var(--text-primary)">Primary text</span><span style="color:var(--text-secondary)">Secondary text</span><span style="color:var(--text-tertiary)">Tertiary text</span><span style="color:var(--text-accent)">Accent text</span></div>
<div class="brd"><span style="box-shadow:inset 0 0 0 1px var(--border-subtle)">subtle</span><span style="box-shadow:inset 0 0 0 1px var(--border-default)">default</span><span style="box-shadow:inset 0 0 0 1px var(--border-strong)">strong</span><span style="box-shadow:inset 0 0 0 1px var(--border-accent)">accent</span></div></body></html>
