<!-- @dsCard group="Effects" viewport="700x230" subtitle="Light emerging from darkness — always with grain" name="Gradients" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.c{display:flex;flex-direction:column;gap:8px}.b{height:150px;border-radius:2px;position:relative;overflow:hidden;background-color:#000}.b::after{content:"";position:absolute;inset:0;background:var(--texture-grain);opacity:var(--grain-opacity);mix-blend-mode:var(--grain-blend)}</style></head><body><div class="r"><div class="c"><div class="b" style="background-image:var(--gradient-horizon)"></div><span class="mono"><b>--gradient-horizon</b></span></div><div class="c"><div class="b" style="background-image:var(--gradient-halo)"></div><span class="mono"><b>--gradient-halo</b></span></div><div class="c"><div class="b" style="background-image:var(--gradient-fade-up)"></div><span class="mono"><b>--gradient-fade-up</b></span></div><div class="c"><div class="b" style="background-image:var(--gradient-steel)"></div><span class="mono"><b>--gradient-steel</b></span></div></div></body></html>
