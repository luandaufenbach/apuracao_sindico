<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.r{display:flex;gap:28px;align-items:center;padding:16px 8px}.c{display:flex;flex-direction:column;gap:14px;align-items:flex-start}.b{width:120px;height:56px;border-radius:2px;background:var(--surface-2)}</style></head><body><div class="r"><div class="c"><div class="b" style="box-shadow:var(--glow-sm)"></div><span class="mono"><b>--glow-sm</b></span></div><div class="c"><div class="b" style="box-shadow:var(--glow-md)"></div><span class="mono"><b>--glow-md</b></span></div><div class="c"><div class="b" style="box-shadow:var(--glow-lg)"></div><span class="mono"><b>--glow-lg</b></span></div><div class="c"><div class="b" style="box-shadow:var(--focus-shadow)"></div><span class="mono"><b>--focus-shadow</b></span></div></div></body></html>
