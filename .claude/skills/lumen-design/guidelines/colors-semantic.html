<!-- @dsCard group="Colors" viewport="700x150" subtitle="Status colors — functional only, always paired with icon or text" name="Semantic" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.c{display:flex;flex-direction:column;gap:8px}.sw{height:56px;border-radius:2px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px}.dot{width:8px;height:8px;border-radius:9999px}</style></head><body><div class="row"><div class="c"><div class="sw" style="background:var(--status-success-bg);color:var(--status-success)"><span class="dot" style="background:var(--status-success)"></span>Confirmed</div><div class="mono"><b>--status-success</b><br>green-500 · bg 12%</div></div><div class="c"><div class="sw" style="background:var(--status-warning-bg);color:var(--status-warning)"><span class="dot" style="background:var(--status-warning)"></span>Pending</div><div class="mono"><b>--status-warning</b><br>amber-500 · bg 12%</div></div><div class="c"><div class="sw" style="background:var(--status-danger-bg);color:var(--status-danger)"><span class="dot" style="background:var(--status-danger)"></span>Failed</div><div class="mono"><b>--status-danger</b><br>red-500 · bg 12%</div></div><div class="c"><div class="sw" style="background:var(--status-info-bg);color:var(--status-info)"><span class="dot" style="background:var(--status-info)"></span>Syncing</div><div class="mono"><b>--status-info</b><br>blue-500 · bg 12%</div></div></div></body></html>
