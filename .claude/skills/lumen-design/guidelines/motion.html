<!-- @dsCard group="Effects" viewport="700x190" subtitle="Hover any row — quick, decelerating, no bounce" name="Motion" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:24px;min-height:100vh}.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--tracking-mono);color:var(--text-tertiary)}.mono b{color:var(--text-primary);font-weight:400}.l{display:grid;grid-template-columns:170px 1fr 70px;align-items:center;gap:16px;padding:8px 0;border-bottom:1px solid var(--border-subtle)}.track{height:2px;background:var(--border-default);position:relative}.dot{position:absolute;left:0;top:-5px;width:12px;height:12px;background:var(--blue-500);border-radius:2px}.l:hover .dot{left:calc(100% - 12px);box-shadow:var(--glow-sm)}</style></head><body><div class="l"><span class="mono"><b>--ease-out</b></span><div class="track"><div class="dot" style="transition:left var(--duration-base) var(--ease-out),box-shadow var(--duration-base) var(--ease-out)"></div></div><span class="mono">220ms</span></div><div class="l"><span class="mono"><b>--ease-in-out</b></span><div class="track"><div class="dot" style="transition:left var(--duration-slow) var(--ease-in-out),box-shadow var(--duration-slow) var(--ease-in-out)"></div></div><span class="mono">360ms</span></div><div class="l"><span class="mono"><b>--ease-emphasized</b></span><div class="track"><div class="dot" style="transition:left var(--duration-slow) var(--ease-emphasized),box-shadow var(--duration-slow) var(--ease-emphasized)"></div></div><span class="mono">360ms</span></div><div class="l"><span class="mono"><b>--ease-out</b></span><div class="track"><div class="dot" style="transition:left var(--duration-fast) var(--ease-out),box-shadow var(--duration-fast) var(--ease-out)"></div></div><span class="mono">140ms</span></div></body></html>
