<body><div id="root"></div>
<script type="text/babel">
const { Navbar, Tabs, Sidebar, BottomNav, Wordmark } = window.LumenDesignSystem_12638a;

function App() {
  const [v, setV] = React.useState('overview');
  const items = [{ value:'overview', label:'Overview', icon:'layout-grid' },{ value:'activity', label:'Activity', icon:'activity', badge:3 },{ value:'assets', label:'Assets', icon:'wallet' },{ value:'settings', label:'Settings', icon:'settings' }];
  return <div className="col" style={{gap:18}}>
    <div style={{boxShadow:'0 0 0 1px var(--border-subtle)'}}><Navbar variant="static" items={[{label:'Platform',children:[{label:'Overview'}]},{label:'Developers'}]} cta={{label:'Get started'}} /></div>
    <div className="row" style={{gap:28}}><Tabs items={['Daily','Weekly','Monthly','All']} /><Tabs variant="segmented" items={[{value:'open',label:'Open',count:12},{value:'closed',label:'Closed'}]} /></div>
    <Tabs variant="underline" items={['Overview','Activity','Research','Settings']} />
    <div style={{display:'grid',gridTemplateColumns:'248px 1fr',gap:16,height:230}}>
      <Sidebar header={<Wordmark size={20} />} value={v} onChange={setV} items={[...items.slice(0,2),{section:'Account'},...items.slice(2)]} style={{boxShadow:'0 0 0 1px var(--border-subtle)'}} />
      <div style={{display:'flex',flexDirection:'column',justifyContent:'flex-end',boxShadow:'0 0 0 1px var(--border-subtle)',borderRadius:4,overflow:'hidden'}}>

        <BottomNav position="static" hideOnDesktop={false} value={v} onChange={setV} items={items} />

}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
