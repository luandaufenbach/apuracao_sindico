<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{padding:20px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);width:72px;flex-shrink:0}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Card, Accordion, Glow, ArrowLink, IndexBadge, Tag } = window.LumenDesignSystem_12638a;

function App() {
  const g = ['horizon','halo','columns','steel'];
  return <div className="col">
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
      <Card padding="md"><IndexBadge value={1} /><div style={{fontSize:17,letterSpacing:'-.02em',margin:'14px 0 6px'}}>Default card</div><div style={{fontSize:13,color:'var(--text-secondary)',marginBottom:14}}>Surface-1 with hairline.</div><ArrowLink>Read docs</ArrowLink></Card>
      <Card variant="inverse" padding="md"><Tag variant="accent">Inverse</Tag><div style={{fontSize:17,letterSpacing:'-.02em',margin:'14px 0 6px'}}>White card</div><div style={{fontSize:13,color:'var(--gray-600)'}}>For light rhythm on dark.</div></Card>
      <Card variant="glow" padding="md" href="#"><Tag>Glow</Tag><div style={{fontSize:17,letterSpacing:'-.02em',margin:'14px 0 6px'}}>Lit card</div><div style={{fontSize:13}}>Hover me.</div></Card>
    </div>
    <Accordion numbered accentOpen defaultOpen={['1']} items={[{title:'Critical — $500,000 USD',content:'Direct theft of funds or permanent freezing.'},{title:'Medium — $10,000 USD',content:'A bug that results in unintended smart contract behaviour with no funds at direct risk.'},{title:'Low — $1,000 USD',content:'Contract fails to deliver promised returns.'}]} />
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8}}>{g.map(v => <Glow key={v} variant={v} minHeight={86} style={{borderRadius:4,display:'flex',alignItems:'flex-end',padding:8}}><span style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'.06em',textTransform:'uppercase'}}>{v}</span></Glow>)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
