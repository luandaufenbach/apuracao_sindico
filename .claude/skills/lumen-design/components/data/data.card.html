<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);width:72px;flex-shrink:0}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { StatCard, BarChart, ValueTag, DataTable, Badge, Tabs, Card } = window.LumenDesignSystem_12638a;

const days = Array.from({length:36},(_,i)=>({label:String(i+1),value:Math.round(8+ Math.pow(Math.sin(i/6),2)*30 + (i===24?14:0) + (i%5)*2 + (i>20&&i<27?(i-20)*5:0))}));
function App() {
  return <div className="col" style={{gap:10}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1.3fr',gap:8}}>
      <StatCard variant="inverse" icon="chart-line" label="In numbers" value="$100M" caption="In bridged USDC" />
      <StatCard variant="accent" icon="wallet" label="Wallets" value="8 Million" caption="Activated wallets" />
      <Card padding="sm"><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}><span style={{fontSize:16,letterSpacing:'-.02em'}}>Daily volume</span><Tabs items={['D','W','M']} /></div><BarChart data={days} height={110} gap={1} format={v=>'$'+v+'M'} xLabels={['Nov 1','Nov 12','Nov 24','Dec 6']} /></Card>
    </div>
    <div className="row"><ValueTag value="$25.14M" /><ValueTag value="−3.2%" direction="down" /><ValueTag value="+12%" variant="light" /><ValueTag value="Live" variant="accent" direction="none" /></div>
    <DataTable columns={[{key:'name',header:'Protocol',primary:true},{key:'cat',header:'Category'},{key:'tvl',header:'TVL',align:'right',mono:true,render:r=>'$'+r.tvl+'M'},{key:'st',header:'Status',sortable:false,render:r=><Badge tone={r.tone}>{r.st}</Badge>}]} rows={[{id:1,name:'Harbor Lend',cat:'Lending',tvl:412.8,st:'Live',tone:'success'},{id:2,name:'Driftline DEX',cat:'Exchange',tvl:318.2,st:'Live',tone:'success'},{id:3,name:'Keel Vaults',cat:'Yield',tvl:96.4,st:'Audit',tone:'warning'}]} onRowClick={()=>{}} />
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
