<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-tertiary);width:72px;flex-shrink:0}</style></head>
<body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.LumenDesignSystem_12638a;

function App() {
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px 24px'}}>
    <Input label="Email" type="email" placeholder="you@team.xyz" required hint="We'll never share it." />
    <Select label="Network" options={['Mainnet','Testnet','Devnet']} defaultValue="Mainnet" />
    <Input label="Amount" placeholder="0.00" suffix="USDC" inputMode="decimal" />
    <Input label="Contract address" defaultValue="0x7a2f…" error="Invalid address format" />
    <Input iconLeft="search" placeholder="Search docs" size="sm" />
    <Input label="Disabled" placeholder="Read only" disabled size="sm" />
    <div className="col" style={{gap:2}}><Checkbox label="Email me release notes" defaultChecked /><Checkbox label="I agree to the terms" description="Required to submit a report" /></div>
    <div className="col" style={{gap:2}}><Radio name="t" value="c" label="Critical" description="Up to $500,000" defaultChecked /><Radio name="t" value="h" label="High" description="Up to $50,000" /></div>
    <div className="col" style={{gap:2,gridColumn:'1 / -1',flexDirection:'row',gap:32}}><Switch label="Price alerts" defaultChecked /><Switch label="Testnet mode" /><Switch label="Disabled" disabled /></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
